<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw 7 Bot 现网状态</title>
  <style>
    :root {
      --bg: #08111f;
      --bg2: #111f35;
      --card: rgba(16, 27, 46, 0.88);
      --text: #eef4ff;
      --muted: #90a7c6;
      --ok: #17c964;
      --warn: #ffb020;
      --danger: #ff5f56;
      --line: rgba(145, 174, 213, 0.18);
      --accent: #57a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(87,166,255,0.22), transparent 32%),
        radial-gradient(circle at top right, rgba(255,95,86,0.16), transparent 26%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      min-height: 100vh;
    }
    .wrap {
      width: min(1400px, calc(100vw - 32px));
      margin: 24px auto 48px;
    }
    .hero {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(7, 15, 29, 0.78);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }
    .eyebrow {
      color: #78c4ff;
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 12px;
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1.05;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }
    .summary-card, .card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      padding: 18px;
      box-shadow: 0 14px 30px rgba(2, 8, 17, 0.28);
    }
    .summary-card strong {
      display: block;
      font-size: 28px;
      margin-top: 6px;
    }
    .links {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .links a {
      color: white;
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: linear-gradient(90deg, #1f6feb, #5f67ff);
      box-shadow: 0 10px 24px rgba(31, 111, 235, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }
    .row {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .label {
      color: var(--muted);
      min-width: 84px;
    }
    .value code {
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #d7e8ff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .ok { background: rgba(23, 201, 100, 0.18); color: #7bf1ad; }
    .warn { background: rgba(255, 176, 32, 0.18); color: #ffd27b; }
    .danger { background: rgba(255, 95, 86, 0.18); color: #ffb0aa; }
    ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: #d6e4ff;
    }
    li { margin: 6px 0; }
    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">OpenClaw / Live Status / 2026-04-22</div>
      <h1>云端 7 Bot 现网模型状态</h1>
      <p>数据来源：远端 <code>openclaw models status --agent &lt;id&gt; --json</code> 实时拉取后本地渲染。</p>
      <div class="summary" id="summary"></div>
      <div class="links">
        <a href="http://claw.origyuan.com:18789/chat?session=main" target="_blank" rel="noreferrer">打开远端 Chat 会话</a>
        <a href="openclaw-7bot-status-2026-04-22.json" target="_blank" rel="noreferrer">打开原始摘要 JSON</a>
      </div>
    </section>
    <section class="grid" id="cards"></section>
    <div class="footer">
      重点风险：7 个 bot 默认模型仍全部指向 <code>chongzhen/gpt-5.4</code>，且多数 bot 的 <code>openai-codex</code> provider 汇总状态为 <code>expired</code>。
    </div>
  </div>
  <script>
    const data = [
      {
        agentId: "jiajing",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4", "chongzhen/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)", "openrouter (1)"],
        oauthProviders: [
          { provider: "jiajing", status: "static", profiles: ["jiajing:default"] },
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "ok", profiles: ["openrouter:default"] }
        ]
      },
      {
        agentId: "tianqi",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)"],
        oauthProviders: [
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "static", profiles: ["openrouter:default", "openrouter:tianqi-29fb87a018f4"] },
          { provider: "tianqi", status: "static", profiles: ["tianqi:default"] }
        ]
      },
      {
        agentId: "wanli",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)", "openrouter (1)"],
        oauthProviders: [
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "ok", profiles: ["openrouter:default", "openrouter:wanli-2738e01e7ec1543"] },
          { provider: "wanli", status: "static", profiles: ["wanli:default"] }
        ]
      },
      {
        agentId: "chenghua",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)"],
        oauthProviders: [
          { provider: "chenghua", status: "static", profiles: ["chenghua:default"] },
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "static", profiles: ["openrouter:default"] }
        ]
      },
      {
        agentId: "yongle",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)", "openrouter (1)"],
        oauthProviders: [
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "ok", profiles: ["openrouter:default"] }
        ]
      },
      {
        agentId: "chongzhen",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)", "openrouter (1)"],
        oauthProviders: [
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "ok", profiles: ["openrouter:default"] }
        ]
      },
      {
        agentId: "xuande",
        defaultModel: "chongzhen/gpt-5.4",
        resolvedDefault: "chongzhen/gpt-5.4",
        fallbacks: ["customer-claude-sonnet-4-6/claude-opus-4-6", "openai-codex/gpt-5.4"],
        providersWithOAuth: ["openai-codex (3)", "openrouter (1)"],
        oauthProviders: [
          { provider: "openai-codex", status: "expired", profiles: ["openai-codex:default", "openai-codex:jiaronghui0203@gmail.com", "openai-codex:jrh990203@gmail.com (jrh990203@gmail.com)"] },
          { provider: "openrouter", status: "ok", profiles: ["openrouter:default"] }
        ]
      }
    ];

    const summary = document.getElementById("summary");
    const cards = document.getElementById("cards");
    const sharedModelCount = data.filter(item => item.resolvedDefault === "chongzhen/gpt-5.4").length;
    const expiredCodexCount = data.filter(item => item.oauthProviders.some(p => p.provider === "openai-codex" && p.status === "expired")).length;
    const openRouterOkCount = data.filter(item => item.oauthProviders.some(p => p.provider === "openrouter" && (p.status === "ok" || p.status === "static"))).length;

    [
      { title: "总 Bot 数", value: data.length, note: "复查范围" },
      { title: "共用主模型", value: `${sharedModelCount}/${data.length}`, note: "全部落到 chongzhen/gpt-5.4" },
      { title: "Codex 过期", value: `${expiredCodexCount}/${data.length}`, note: "按 provider 汇总状态" },
      { title: "OpenRouter 可用", value: `${openRouterOkCount}/${data.length}`, note: "ok 或 static" }
    ].forEach(item => {
      const el = document.createElement("div");
      el.className = "summary-card";
      el.innerHTML = `<div>${item.title}</div><strong>${item.value}</strong><div>${item.note}</div>`;
      summary.appendChild(el);
    });

    const statusClass = (status) => {
      if (status === "ok" || status === "static") return "ok";
      if (status === "expired") return "danger";
      return "warn";
    };

    data.forEach(item => {
      const codex = item.oauthProviders.find(p => p.provider === "openai-codex");
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <h2>${item.agentId}</h2>
        <div class="row"><span class="label">默认模型</span><span class="value"><code>${item.defaultModel}</code></span></div>
        <div class="row"><span class="label">实际解析</span><span class="value"><code>${item.resolvedDefault}</code></span></div>
        <div class="row"><span class="label">Codex OAuth</span><span class="badge ${statusClass(codex ? codex.status : 'unknown')}">${codex ? codex.status : "unknown"}</span></div>
        <div class="row"><span class="label">Fallback</span></div>
        <ul>${item.fallbacks.map(model => `<li><code>${model}</code></li>`).join("")}</ul>
        <div class="row"><span class="label">OAuth Provider</span></div>
        <ul>${item.oauthProviders.map(p => `<li><strong>${p.provider}</strong> <span class="badge ${statusClass(p.status)}">${p.status}</span><br>${p.profiles.map(v => `<code>${v}</code>`).join(" ")}</li>`).join("")}</ul>
      `;
      cards.appendChild(card);
    });
  </script>
</body>
</html>
